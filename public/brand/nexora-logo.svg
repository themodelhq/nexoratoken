<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C68A"/>
      <stop offset="50%" stop-color="#D0A15F"/>
      <stop offset="100%" stop-color="#A87A3D"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#163EA8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#D0A15F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D0A15F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background glow -->
  <circle cx="256" cy="256" r="240" fill="url(#glow)"/>
  <!-- Outer hexagon ring -->
  <path d="M256 56 L416 148 L416 364 L256 456 L96 364 L96 148 Z" stroke="url(#goldGrad)" stroke-width="6" fill="none" opacity="0.55"/>
  <!-- Inner hexagon -->
  <path d="M256 96 L380 168 L380 344 L256 416 L132 344 L132 168 Z" stroke="url(#goldGrad)" stroke-width="4" fill="#0B1220" opacity="0.9"/>
  <!-- Stylized N made of nodes and lines -->
  <g stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="196" y1="340" x2="196" y2="172"/>
    <line x1="196" y1="172" x2="316" y2="340"/>
    <line x1="316" y1="340" x2="316" y2="172"/>
  </g>
  <!-- Node circles -->
  <circle cx="196" cy="172" r="13" fill="url(#goldGrad)"/>
  <circle cx="316" cy="340" r="13" fill="url(#goldGrad)"/>
  <circle cx="316" cy="172" r="13" fill="url(#blueGrad)"/>
  <circle cx="196" cy="340" r="13" fill="url(#blueGrad)"/>
  <!-- Circuit accents -->
  <g stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="96" y1="148" x2="60" y2="120"/>
    <line x1="416" y1="148" x2="452" y2="120"/>
    <line x1="96" y1="364" x2="60" y2="392"/>
    <line x1="416" y1="364" x2="452" y2="392"/>
  </g>
  <circle cx="60" cy="120" r="6" fill="#38BDF8"/>
  <circle cx="452" cy="120" r="6" fill="#38BDF8"/>
  <circle cx="60" cy="392" r="6" fill="#38BDF8"/>
  <circle cx="452" cy="392" r="6" fill="#38BDF8"/>
</svg>
